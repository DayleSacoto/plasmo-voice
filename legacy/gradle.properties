modName=Plasmo Voice
modId=plasmovoice
modGroup=su.plo.voice

# Release version of Plasmo Voice Legacy Forge (SemVer): the one source for the mod version, mcmod.info, the JAR name
# and the update check. Independent of upstream Plasmo Voice; the backport itself is based on upstream 2.1.17.
# Tag a release legacy-X.Y.Z: the update check of installed copies reads only tags of that form.
legacyVersion=0.4.0
# Generated constant holding legacyVersion, for @Mod and the code.
generateGradleTokenClass=su.plo.voice.platform.forge.Tags
gradleTokenVersion=VERSION

useModGroupForPublishing=true
autoUpdateBuildScript=false

minecraftVersion=1.7.10
forgeVersion=10.13.4.1614
customArchiveBaseName=plasmovoice-forge-1.7.10

channel=stable
mappingsVersion=12
remoteMappings=https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

developmentEnvironmentUserName=SacotoDayle

enableModernJavaSyntax=modern
enableGenericInjection=true

usesMixins=false

gtnh.modules.codeStyle=false

# Opus natives are bound to com.plasmoverse.opus JNI names, so build.gradle.kts relocates selected libraries instead.
usesShadowedDependencies=true
relocateShadowedDependencies=false
minimizeShadowedDependencies=false
