name: Release

# Publishes Plasmo Voice Legacy Forge for a pushed tag legacy-X.Y.Z, where X.Y.Z is legacyVersion in
# legacy/gradle.properties:
#
#   validate -> build -> github      (GitHub Release with the mod, -dev and -sources JARs)
#                     -> curseforge  (the mod JAR only)
#
# The tagged commit is built once, by build.yml; both publishing jobs take its artifacts and do not depend on each
# other. Nothing is published when validation, the tests or the build fail.
#
# The GitHub Release is a pre-release and the CurseForge file is a beta: the project is in active development, and
# the update check of installed copies counts pre-releases. The tag never carries a pre-release suffix.
# To promote a tested release: gh release edit legacy-X.Y.Z --prerelease=false --latest
#
# CurseForge needs two repository settings (Settings -> Secrets and variables -> Actions):
#   secret   CURSEFORGE_TOKEN       an API token of the CurseForge author account
#   variable CURSEFORGE_PROJECT_ID  the numeric ID of the CurseForge project
on:
  push:
    tags:
      - 'legacy-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.tag.outputs.version }}
      runtime-jar: ${{ steps.tag.outputs.runtime-jar }}
      dev-jar: ${{ steps.tag.outputs.dev-jar }}
      sources-jar: ${{ steps.tag.outputs.sources-jar }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    # legacyVersion in legacy/gradle.properties is the one source of the release version and of the file names.
    - name: Validate the release tag
      id: tag
      shell: pwsh
      working-directory: legacy
      run: |
        $ErrorActionPreference = 'Stop'
        $tag = $env:GITHUB_REF_NAME
        if ($env:GITHUB_REF_TYPE -ne 'tag' -or $tag -cnotmatch '^legacy-[0-9]+\.[0-9]+\.[0-9]+$') {
          throw "Not a release tag: '$tag'. A release tag is legacy-X.Y.Z"
        }
        $match = Select-String -LiteralPath 'gradle.properties' -Pattern '^legacyVersion=(.+)$'
        if (-not $match) { throw 'legacyVersion is missing from gradle.properties' }
        $version = $match.Matches[0].Groups[1].Value.Trim()
        if ($tag -cne "legacy-$version") {
          throw "Tag $tag does not match legacyVersion=$version in legacy/gradle.properties"
        }
        $base = "plasmovoice-forge-1.7.10-$version"
        @(
          "version=$version"
          "runtime-jar=${base}.jar"
          "dev-jar=${base}-dev.jar"
          "sources-jar=${base}-sources.jar"
        ) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  github:
    needs: [validate, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      RUNTIME_JAR: ${{ needs.validate.outputs.runtime-jar }}
      DEV_JAR: ${{ needs.validate.outputs.dev-jar }}
      SOURCES_JAR: ${{ needs.validate.outputs.sources-jar }}

    steps:
    - name: Refuse to replace an existing release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        existing=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
        if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$existing"; then
          echo "::error::A release for $GITHUB_REF_NAME already exists. Published releases are not replaced."
          exit 1
        fi

    - name: Download the mod JAR
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ needs.validate.outputs.runtime-jar }}
        path: dist

    - name: Download the dev JAR
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ needs.validate.outputs.dev-jar }}
        path: dist

    - name: Download the sources JAR
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ needs.validate.outputs.sources-jar }}
        path: dist

    # The pushed tag is the release tag: --verify-tag stops gh from creating one. The assets are the three JARs.
    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        expected=$(printf '%s\n' "dist/$DEV_JAR" "dist/$RUNTIME_JAR" "dist/$SOURCES_JAR" | sort)
        found=$(find dist -type f | sort)
        if [[ "$found" != "$expected" ]]; then
          echo "::error::Expected exactly the three release JARs in dist, found: $found"
          exit 1
        fi
        gh release create "$GITHUB_REF_NAME" "dist/$RUNTIME_JAR" "dist/$DEV_JAR" "dist/$SOURCES_JAR" \
          --verify-tag --generate-notes --prerelease --title "Plasmo Voice Legacy Forge $VERSION"

  curseforge:
    needs: [validate, build]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RUNTIME_JAR: ${{ needs.validate.outputs.runtime-jar }}

    steps:
    # End users get the mod JAR only: the -dev and -sources JARs are never downloaded here.
    - name: Download the mod JAR
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ needs.validate.outputs.runtime-jar }}
        path: dist

    # upload-file only ever adds a file and never replaces one; CurseForge rejects a JAR the project already has as
    # a duplicate. No retry: a retry after a timeout could upload the file twice.
    - name: Upload the mod JAR to CurseForge
      env:
        CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      run: |
        if [[ ! "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ ]]; then
          echo "::error::Set the repository variable CURSEFORGE_PROJECT_ID to the numeric ID of the CurseForge project"
          exit 1
        fi
        if [[ -z "$CURSEFORGE_TOKEN" ]]; then
          echo "::error::Set the repository secret CURSEFORGE_TOKEN"
          exit 1
        fi
        found=$(find dist -type f)
        if [[ "$found" != "dist/$RUNTIME_JAR" ]]; then
          echo "::error::Expected only dist/$RUNTIME_JAR, found: $found"
          exit 1
        fi

        jq -n --arg name "Plasmo Voice Legacy Forge $VERSION" \
          --arg changelog "Plasmo Voice Legacy Forge $VERSION for Minecraft 1.7.10 / Forge. Release notes: $RELEASE_URL" \
          '{changelog: $changelog, changelogType: "markdown", displayName: $name,
            gameVersionNames: ["1.7.10", "Forge"], releaseType: "beta"}' > metadata.json

        response=$(curl --silent --show-error --fail-with-body --max-time 600 \
          -H "X-Api-Token: $CURSEFORGE_TOKEN" \
          -F "metadata=<metadata.json" -F "file=@dist/$RUNTIME_JAR" \
          "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file") || {
          echo "::error::CurseForge upload failed: $response"
          exit 1
        }
        file_id=$(jq -er '.id' <<< "$response") || {
          echo "::error::CurseForge returned no file ID: $response"
          exit 1
        }
        echo "CurseForge file $file_id: \`$RUNTIME_JAR\` (beta)" >> "$GITHUB_STEP_SUMMARY"
