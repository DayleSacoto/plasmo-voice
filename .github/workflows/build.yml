name: Build

# Verification of the Legacy Forge branch, and the build that release.yml calls for a release tag. Never publishes
# anything itself: the three JARs are left as artifacts of the run.
on:
  push:
    branches:
      - 1.7.10
  pull_request:
    branches:
      - 1.7.10
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: legacy

    steps:
    # Keep the LF line endings stored in Git so bundled lang/toml resources match a non-Windows checkout.
    - name: Disable CRLF conversion
      working-directory: ${{ github.workspace }}
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        add-job-summary: on-failure

    # legacyVersion in legacy/gradle.properties is the one source of the release version and of the file names.
    - name: Read the Legacy Forge version
      run: |
        $ErrorActionPreference = 'Stop'
        $match = Select-String -LiteralPath 'gradle.properties' -Pattern '^legacyVersion=(.+)$'
        if (-not $match) { throw 'legacyVersion is missing from gradle.properties' }
        $version = $match.Matches[0].Groups[1].Value.Trim()
        $base = "plasmovoice-forge-1.7.10-$version"
        @(
          "LEGACY_VERSION=$version"
          "RUNTIME_JAR=${base}.jar"
          "DEV_JAR=${base}-dev.jar"
          "SOURCES_JAR=${base}-sources.jar"
        ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    # build makes all three JARs: the reobfuscated mod, the deobfuscated -dev JAR and the -sources JAR.
    - name: Build with Gradle
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($tasks in @(@('--stop'), @('clean'), @('compileKotlin', 'compileJava'), @('test'), @('verifyShadedJar'), @('build'))) {
          ./gradlew.bat @tasks --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "gradlew $tasks failed with exit code $LASTEXITCODE" }
        }

    - name: Check the distribution JARs
      run: |
        $ErrorActionPreference = 'Stop'
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        function Test-Jar($name, $entry) {
          $path = Join-Path 'build/libs' $name
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "JAR not found: $path" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $path))
          try {
            if (-not ($zip.Entries | Where-Object FullName -eq $entry)) { throw "$name does not contain $entry" }
          } finally {
            $zip.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "- ``$name``: $((Get-Item -LiteralPath $path).Length) bytes, SHA-256 ``$hash``"
        }
        $mod = 'su/plo/voice/platform/forge/PlasmoVoiceMod'
        @(
          "# Plasmo Voice Legacy Forge $env:LEGACY_VERSION"
          ''
          '- Minecraft: 1.7.10'
          '- Java: 25'
          '- Tests: passed'
          (Test-Jar $env:RUNTIME_JAR "$mod.class")
          (Test-Jar $env:DEV_JAR "$mod.class")
          (Test-Jar $env:SOURCES_JAR "$mod.java")
        ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

    # One artifact per JAR, not zipped: with archive disabled the artifact is the file itself, under its own name.
    - name: Upload the mod JAR
      uses: actions/upload-artifact@v7.0.1
      with:
        path: legacy/build/libs/${{ env.RUNTIME_JAR }}
        archive: false
        if-no-files-found: error
        retention-days: 30

    - name: Upload the dev JAR
      uses: actions/upload-artifact@v7.0.1
      with:
        path: legacy/build/libs/${{ env.DEV_JAR }}
        archive: false
        if-no-files-found: error
        retention-days: 30

    - name: Upload the sources JAR
      uses: actions/upload-artifact@v7.0.1
      with:
        path: legacy/build/libs/${{ env.SOURCES_JAR }}
        archive: false
        if-no-files-found: error
        retention-days: 30
